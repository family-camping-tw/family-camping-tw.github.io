<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="以高鐵新竹站出發，篩選適合親子家庭的露營地。">
    <meta property="og:title" content="露營地點搜尋">
    <meta property="og:description" content="依縣市、車程、海拔、場地條件縮小選擇，找到下次出遊的營地。">
    <meta property="og:image" content="assets/camping-family-header.png?v=20260719-riverside">
    <meta name="twitter:card" content="summary_large_image">
    <title>露營地點搜尋</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="stylesheet" href="styles.css?v=20260717-mobile-altitude">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <p class="brand">露營地點搜尋</p>
        <p class="brand-note">從高鐵新竹站出發</p>
      </div>
      <div class="header-actions">
        <button class="header-action" id="feedback-button" type="button">回報／推薦</button>
        <button class="icon-button" id="mobile-filter-button" type="button" aria-label="開啟篩選" aria-controls="filters" aria-expanded="false" title="篩選">
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main>
      <section class="search-band" aria-labelledby="search-title">
        <img class="search-band-image" src="assets/camping-family-header.png?v=20260719-riverside" alt="溪畔森林中的帳篷與天幕營位">
        <div>
          <h1 id="search-title">找到下次出遊的營地</h1>
          <p>依縣市、車程、海拔、場地條件縮小選擇。</p>
        </div>
        <label class="search-box">
          <span class="sr-only">搜尋營地或特色</span>
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜尋營地或特色">
        </label>
      </section>

      <div class="app-shell">
        <button class="filter-backdrop" id="filter-backdrop" type="button" aria-label="關閉篩選" tabindex="-1"></button>
        <aside class="filters" id="filters" aria-label="營地篩選">
          <div class="filter-heading">
            <h2>篩選條件</h2>
            <div class="filter-heading-actions">
              <button class="text-button" id="reset-filters" type="button">全部清除</button>
              <button class="icon-button mobile-filter-close" id="close-mobile-filters" type="button" aria-label="關閉篩選" title="關閉">×</button>
            </div>
          </div>

          <label class="field">縣市<select id="filter-county"><option value="">全部縣市</option></select></label>
          <label class="field" id="town-filter-field" hidden>鄉鎮<select id="filter-town"><option value="">全部</option></select></label>
          <label class="field">訂位平台<select id="filter-booking"><option value="">全部平台</option></select></label>
          <label class="field">最長車程<select id="filter-drive"><option value="">不限</option><option value="60">1 小時內</option><option value="90">1.5 小時內</option><option value="120">2 小時內</option><option value="180">3 小時內</option></select></label>
          <label class="field">最高海拔<select id="filter-altitude"><option value="">不限</option><option value="1000-plus">1000m 以上</option><option value="750-999">750～999m</option><option value="500-749">500～749m</option><option value="0-499">499m 以下</option></select></label>
          <label class="field">營地材質<select id="filter-surface"><option value="">不限</option><option>草地</option><option>碎石</option><option>草石混合</option><option>木棧板</option><option>水泥或硬地</option><option>多種材質</option><option>不確定</option></select></label>

          <fieldset>
            <legend>家庭需求</legend>
            <label class="check-row"><input type="checkbox" id="filter-rain"> 有雨棚</label>
            <label class="check-row"><input type="checkbox" id="filter-kids"> 有戲水或兒童設施</label>
            <label class="check-row"><input type="checkbox" id="filter-lodging"> 有免搭帳或房型</label>
            <label class="check-row"><input type="checkbox" id="filter-car"> 可以車露/車宿</label>
            <label class="check-row"><input type="checkbox" id="filter-car-side"> 車可停帳邊</label>
          </fieldset>

          <div class="mobile-filter-actions">
            <button class="primary-button" id="apply-mobile-filters" type="button">顯示結果</button>
          </div>
        </aside>

        <section class="results" aria-live="polite">
          <div class="results-toolbar">
            <p id="result-count"></p>
            <label class="sort-field">排序<select id="sort-select"><option value="random">隨機推薦</option><option value="drive">車程由短到長</option><option value="rating">Google 星等由高到低</option><option value="altitude">海拔由高到低</option></select></label>
          </div>
          <div class="active-filters" id="active-filters"></div>
          <aside class="trip-notes" aria-label="行前提醒">
            <p><strong>車程估算</strong><span>車程以高鐵新竹站出發，依路況暢通時的行車時間估算。</span></p>
            <p><strong>資料提醒</strong><span>發現資料有誤？你很可能是對的，請以營地最新公告為準。</span></p>
          </aside>
          <div class="camp-list" id="camp-list"></div>
          <div class="empty-state" id="empty-state" hidden>
            <h2>沒有符合的營地</h2>
            <p>放寬一兩個條件，再看看其他選擇。</p>
          </div>
        </section>
      </div>
    </main>

    <section class="compare-dock" id="compare-dock" aria-label="營地比較" hidden>
      <div><strong>比較營地</strong><span id="compare-summary"></span></div>
      <button class="primary-button" id="open-compare" type="button">開啟比較</button>
    </section>

    <dialog id="compare-dialog">
      <div class="dialog-header">
        <div><p class="eyebrow">最多 3 個營地</p><h2>營地比較</h2></div>
        <button class="icon-button" id="close-compare" type="button" aria-label="關閉比較" title="關閉">×</button>
      </div>
      <div class="compare-table-wrap" id="compare-table"></div>
    </dialog>

    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
      <div class="dialog-header">
        <div><p class="eyebrow">一起讓資料更實用</p><h2 id="feedback-title">回報問題／推薦營地</h2></div>
        <button class="icon-button" id="close-feedback" type="button" aria-label="關閉回報表單" title="關閉">×</button>
      </div>
      <p class="feedback-intro">資料有誤，或有想加入的營地，都可以告訴我。回報者 Email 為選填，僅供需要時回覆。</p>
      <form id="feedback-form" class="feedback-form" novalidate>
        <fieldset class="feedback-type">
          <legend>回報類型</legend>
          <label><input type="radio" name="feedback_type" value="資料問題" checked> 回報資料問題</label>
          <label><input type="radio" name="feedback_type" value="推薦營地"> 推薦營地</label>
        </fieldset>

        <label class="field">營地名稱<span class="required-mark" aria-hidden="true">*</span>
          <input id="feedback-camp-name" name="camp_name" type="text" list="camp-name-options" maxlength="100" required autocomplete="off">
        </label>
        <datalist id="camp-name-options"></datalist>

        <div id="feedback-problem-fields" class="feedback-section">
          <label class="field">問題欄位<span class="required-mark" aria-hidden="true">*</span>
            <select id="feedback-issue-category" name="issue_category" required>
              <option value="">請選擇</option>
              <option>地點／縣市鄉鎮</option>
              <option>Google 星等／評論數</option>
              <option>車程</option>
              <option>海拔</option>
              <option>訂位／價格</option>
              <option>房型／設施</option>
              <option>特色摘要</option>
              <option>其他</option>
            </select>
          </label>
          <label class="field">問題說明或正確資訊<span class="required-mark" aria-hidden="true">*</span>
            <textarea id="feedback-correction" name="correction" rows="5" maxlength="2000" required placeholder="請描述你看到的問題，或提供可核對的正確資訊"></textarea>
          </label>
          <label class="field">參考網址
            <input id="feedback-problem-source" name="problem_source_url" type="url" maxlength="500" placeholder="https://">
          </label>
        </div>

        <div id="feedback-recommendation-fields" class="feedback-section" hidden>
          <label class="field">縣市或所在地
            <input id="feedback-location" name="location" type="text" maxlength="100">
          </label>
          <label class="field">推薦原因／附註
            <textarea id="feedback-recommendation-note" name="recommendation_note" rows="5" maxlength="2000" placeholder="例如：有官方訂位頁、適合親子，或你希望整理的特色"></textarea>
          </label>
          <label class="field">官方網站、訂位頁或 Google Maps 網址
            <input id="feedback-recommendation-source" name="recommendation_source_url" type="url" maxlength="500" placeholder="https://">
          </label>
        </div>

        <label class="field">回報者 Email（選填）
          <input id="feedback-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="如希望收到回覆，再填寫即可">
        </label>
        <input class="feedback-honeypot" name="_gotcha" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input id="feedback-subject" name="_subject" type="hidden" value="[露營地點搜尋] 資料回報">
        <input name="page_url" type="hidden">
        <input name="site_name" type="hidden" value="露營地點搜尋">
        <div id="feedback-status" class="feedback-status" role="status" aria-live="polite"></div>
        <div class="feedback-actions">
          <button class="secondary-button" id="cancel-feedback" type="button">取消</button>
          <button class="primary-button" id="submit-feedback" type="submit">送出回報</button>
        </div>
      </form>
    </dialog>

    <div id="feedback-toast" class="feedback-toast" role="status" aria-live="polite" hidden></div>

    <script src="config.js?v=20260805-feedback"></script>
    <script src="data/camps.js?v=59721ed99c0a"></script>
    <script src="app.js?v=20260805-feedback-success2"></script>
  </body>
</html>
